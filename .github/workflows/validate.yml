name: validate

# There is no build and no publish step. A marketplace reads this repo live from
# a git ref, so whatever is on the pinned ref is what users get. That makes CI a
# gate on correctness rather than a deploy pipeline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    name: manifests validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and every plugin in it
        run: |
          set -e
          claude plugin validate . --strict
          for d in plugins/*/; do
            echo "::group::$d"
            claude plugin validate "$d" --strict
            echo "::endgroup::"
          done

  pins:
    name: pins resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every pinned ref must exist where it is pinned
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          market = json.load(open(".claude-plugin/marketplace.json"))
          problems = []

          def remote_has_tag(url, ref):
              out = subprocess.run(["git", "ls-remote", "--tags", url, ref],
                                   capture_output=True, text=True).stdout
              return bool(out.strip())

          for entry in market["plugins"]:
              name, src = entry["name"], entry["source"]

              # A plugin that lives in this repo: its version must have a pushed tag.
              if isinstance(src, str):
                  manifest = pathlib.Path(src) / ".claude-plugin" / "plugin.json"
                  if not manifest.exists():
                      problems.append(f"{name}: {manifest} does not exist")
                      continue
                  version = json.load(open(manifest)).get("version")
                  if not version:
                      problems.append(f"{name}: plugin.json has no version, so users are never told to update")
                      continue
                  tag = f"{name}--v{version}"
                  tags = subprocess.run(["git", "tag", "--list", tag],
                                        capture_output=True, text=True).stdout.split()
                  if tag not in tags:
                      problems.append(
                          f"{name}: version {version} has no tag {tag}. "
                          f"Create it with: claude plugin tag ./{src.lstrip('./')} --push")
                  continue

              # A plugin sourced from another repo: the ref must exist on that remote,
              # because a pin to a tag nobody pushed validates here and fails at
              # install time for everyone.
              ref = src.get("ref")
              if not ref:
                  problems.append(f"{name}: pins no ref, so it tracks a default branch")
                  continue
              if src.get("source") == "github":
                  url = f"https://github.com/{src['repo']}"
              elif src.get("source") in ("git-subdir", "url"):
                  url = src["url"]
              else:
                  problems.append(f"{name}: unrecognized source type {src.get('source')!r}")
                  continue
              if not remote_has_tag(url, ref):
                  problems.append(f"{name}: {url} has no tag {ref}, so installing it would fail")

          for p in problems:
              print(f"::error::{p}")
          print(f"{len(problems)} pin problem(s)")
          sys.exit(1 if problems else 0)
          PY

  links:
    name: relative links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every relative markdown link
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.md"):
              if ".git" in f.parts:
                  continue
              for link in re.findall(r"\]\((?!https?:|mailto:|#)([^)]+)\)", f.read_text(encoding="utf-8")):
                  if not (f.parent / link.split("#")[0]).resolve().exists():
                      bad.append(f"{f}: {link}")
          for b in bad:
              print(f"::error::broken: {b}")
          print(f"{len(bad)} broken link(s)")
          sys.exit(1 if bad else 0)
          PY

  prose:
    name: house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No em-dashes, American spelling
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # The house rule governs OUR prose, not quoted sources.
          def strip_quoted(line):
              if line.lstrip().startswith(">"):
                  return ""
              line = re.sub(r'"[^"]*"', "", line)
              line = re.sub(r"`[^`]*`", "", line)
              return line

          BRITISH = re.compile(r"\b(colour|behaviour|neighbour|favour)[a-z]*", re.I)
          bad = []
          for f in sorted(pathlib.Path(".").rglob("*.md")):
              if ".git" in f.parts:
                  continue
              for n, raw in enumerate(f.read_text(encoding="utf-8").splitlines(), 1):
                  line = strip_quoted(raw)
                  if "—" in line:
                      bad.append(f"{f}:{n}: em-dash outside a quote")
                  m = BRITISH.search(line)
                  if m and "spelling" not in raw.lower():
                      bad.append(f"{f}:{n}: British spelling '{m.group(0)}' outside a quote")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} house-style violation(s)")
          sys.exit(1 if bad else 0)
          PY
