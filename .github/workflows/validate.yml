name: validate

# There is no build and no publish step. A marketplace reads this repo live from
# a git ref, so whatever is on the pinned ref is what users get. That makes CI a
# gate on correctness rather than a deploy pipeline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    name: manifests validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and every plugin in it
        run: |
          set -e
          claude plugin validate . --strict
          for d in plugins/*/; do
            echo "::group::$d"
            claude plugin validate "$d" --strict
            echo "::endgroup::"
          done

  frontmatter:
    name: skill frontmatter parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every SKILL.md must have parseable frontmatter
        run: |
          python - <<'PY'
          import pathlib, re, sys, yaml

          # claude plugin validate only scans skills/<name>/SKILL.md. A root-level
          # skill (plugins/agent-viz/SKILL.md) and this repo's own .claude/ skills
          # are invisible to it. Unparseable frontmatter is not a warning: the skill
          # loads with every field silently dropped.
          bad = []
          for f in sorted(pathlib.Path(".").rglob("SKILL.md")):
              if ".git" in f.parts:
                  continue
              m = re.match(r"^---\n(.*?)\n---\n", f.read_text(encoding="utf-8"), re.S)
              if not m:
                  bad.append(f"{f}: no YAML frontmatter block")
                  continue
              try:
                  meta = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  bad.append(f"{f}: frontmatter does not parse ({str(e).splitlines()[0]}). "
                             f"A description containing ': ' must be quoted.")
                  continue
              for key in ("name", "description"):
                  if not (isinstance(meta, dict) and meta.get(key)):
                      bad.append(f"{f}: frontmatter has no {key}")

          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} frontmatter problem(s)")
          sys.exit(1 if bad else 0)
          PY

  tags:
    name: versions have tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every plugin version must have a pushed tag
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          # Every plugin now lives in this repo, so there are no cross-repo pins to
          # verify. What is left is the release marker: a version with no tag means
          # the release was never actually cut, and nothing records what shipped.
          market = json.load(open(".claude-plugin/marketplace.json"))
          problems = []

          for entry in market["plugins"]:
              name, src = entry["name"], entry["source"]
              if not isinstance(src, str):
                  problems.append(f"{name}: external source {src!r}; this repo expects plugins under plugins/")
                  continue
              manifest = pathlib.Path(src) / ".claude-plugin" / "plugin.json"
              if not manifest.exists():
                  problems.append(f"{name}: {manifest} does not exist")
                  continue
              version = json.load(open(manifest)).get("version")
              if not version:
                  problems.append(f"{name}: plugin.json has no version, so users are never told to update")
                  continue
              tag = f"{name}--v{version}"
              tags = subprocess.run(["git", "tag", "--list", tag],
                                    capture_output=True, text=True).stdout.split()
              if tag not in tags:
                  problems.append(
                      f"{name}: version {version} has no tag {tag}. "
                      f"Cut it with: claude plugin tag ./{src.lstrip('./')} --push")

          for p in problems:
              print(f"::error::{p}")
          print(f"{len(problems)} tag problem(s)")
          sys.exit(1 if problems else 0)
          PY

  links:
    name: relative links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every relative markdown link
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.md"):
              if ".git" in f.parts:
                  continue
              for link in re.findall(r"\]\((?!https?:|mailto:|#)([^)]+)\)", f.read_text(encoding="utf-8")):
                  if not (f.parent / link.split("#")[0]).resolve().exists():
                      bad.append(f"{f}: {link}")
          for b in bad:
              print(f"::error::broken: {b}")
          print(f"{len(bad)} broken link(s)")
          sys.exit(1 if bad else 0)
          PY

  prose:
    name: house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No em-dashes, American spelling
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # The house rule governs OUR prose, not quoted sources. A quotation keeps
          # whatever the source wrote, including em-dashes and British spelling.
          def strip_quoted(line):
              if line.lstrip().startswith(">"):      # blockquote
                  return ""
              line = re.sub(r'"[^"]*"', "", line)    # inline quotation
              line = re.sub(r"`[^`]*`", "", line)    # code and term-mentions
              return line

          BRITISH = re.compile(r"\b(colour|behaviour|neighbour|favour)[a-z]*", re.I)
          bad = []
          for f in sorted(pathlib.Path(".").rglob("*.md")):
              if ".git" in f.parts:
                  continue
              for n, raw in enumerate(f.read_text(encoding="utf-8").splitlines(), 1):
                  line = strip_quoted(raw)
                  if "—" in line:
                      bad.append(f"{f}:{n}: em-dash outside a quote")
                  m = BRITISH.search(line)
                  if m and "spelling" not in raw.lower():
                      bad.append(f"{f}:{n}: British spelling '{m.group(0)}' outside a quote")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} house-style violation(s)")
          sys.exit(1 if bad else 0)
          PY
