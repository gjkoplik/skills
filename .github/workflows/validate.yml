name: validate

# There is no build and no publish step. A marketplace reads this repo live from
# a git ref, so whatever is on the pinned ref is what users get. That makes CI a
# gate on correctness rather than a deploy pipeline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    name: manifests validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and every plugin in it
        run: |
          set -e
          claude plugin validate . --strict
          for d in plugins/*/; do
            echo "::group::$d"
            claude plugin validate "$d" --strict
            echo "::endgroup::"
          done

  frontmatter:
    name: skill frontmatter parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        # Not stdlib. The runner does not have it, and a local box usually does,
        # which is exactly how this job shipped broken the first time.
        run: pip install --quiet pyyaml
      - name: Every SKILL.md must have parseable frontmatter
        run: |
          python - <<'PY'
          import pathlib, re, sys, yaml

          # claude plugin validate only scans skills/<name>/SKILL.md. A root-level
          # skill (plugins/agent-viz/SKILL.md) and this repo's own .claude/ skills
          # are invisible to it. Unparseable frontmatter is not a warning: the skill
          # loads with every field silently dropped.
          bad = []
          for f in sorted(pathlib.Path(".").rglob("SKILL.md")):
              if ".git" in f.parts:
                  continue
              m = re.match(r"^---\n(.*?)\n---\n", f.read_text(encoding="utf-8"), re.S)
              if not m:
                  bad.append(f"{f}: no YAML frontmatter block")
                  continue
              try:
                  meta = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  bad.append(f"{f}: frontmatter does not parse ({str(e).splitlines()[0]}). "
                             f"A description containing ': ' must be quoted.")
                  continue
              for key in ("name", "description"):
                  if not (isinstance(meta, dict) and meta.get(key)):
                      bad.append(f"{f}: frontmatter has no {key}")

          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} frontmatter problem(s)")
          sys.exit(1 if bad else 0)
          PY

  pins:
    name: pins resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every plugin must be pinned to a tag that exists
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          # Plugins are pinned to their own tags rather than sourced by relative
          # path. A relative path resolves against whatever the marketplace repo's
          # default branch is at, so a fresh install would pull unreleased work off
          # main. The version bump only gates updates for people already installed.
          market = json.load(open(".claude-plugin/marketplace.json"))
          problems, notices = [], []

          for entry in market["plugins"]:
              name, src = entry["name"], entry["source"]

              if isinstance(src, str):
                  problems.append(
                      f"{name}: sourced by relative path {src!r}, which tracks the default branch. "
                      f"Pin it to a tag with a git-subdir source.")
                  continue
              if src.get("source") != "git-subdir":
                  problems.append(f"{name}: source type {src.get('source')!r}; this repo pins with git-subdir")
                  continue

              path, ref = src.get("path"), src.get("ref")
              if not ref:
                  problems.append(f"{name}: pins no ref, so it tracks a default branch")
                  continue

              manifest = pathlib.Path(path or "") / ".claude-plugin" / "plugin.json"
              if not manifest.exists():
                  problems.append(f"{name}: path {path!r} has no plugin manifest")
                  continue
              version = json.load(open(manifest)).get("version")
              if not version:
                  problems.append(f"{name}: plugin.json has no version, so users are never told to update")
                  continue

              expected = f"{name}--v{version}"
              if ref != expected:
                  problems.append(
                      f"{name}: pinned to {ref!r} but plugin.json says {version}. "
                      f"Bump one or the other so they agree ({expected}).")
                  continue

              tags = subprocess.run(["git", "tag", "--list", ref],
                                    capture_output=True, text=True).stdout.split()
              if ref not in tags:
                  problems.append(
                      f"{name}: tag {ref} does not exist, so installing it would fail for everyone. "
                      f"Cut it with: claude plugin tag ./{path} --push")
                  continue

              # Not a failure. Main being ahead of a pin is the normal state; this
              # just makes it visible which plugins are sitting on unshipped work.
              diff = subprocess.run(["git", "diff", "--quiet", ref, "HEAD", "--", path])
              if diff.returncode != 0:
                  files = subprocess.run(["git", "diff", "--name-only", ref, "HEAD", "--", path],
                                         capture_output=True, text=True).stdout.split()
                  notices.append(f"{name}: {len(files)} file(s) changed on main since {ref}, not shipped to users")

          for n in notices:
              print(f"::notice::{n}")
          for p in problems:
              print(f"::error::{p}")
          print(f"{len(problems)} pin problem(s), {len(notices)} plugin(s) with unshipped work on main")
          sys.exit(1 if problems else 0)
          PY

  links:
    name: relative links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every relative markdown link
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.md"):
              if ".git" in f.parts:
                  continue
              for link in re.findall(r"\]\((?!https?:|mailto:|#)([^)]+)\)", f.read_text(encoding="utf-8")):
                  if not (f.parent / link.split("#")[0]).resolve().exists():
                      bad.append(f"{f}: {link}")
          for b in bad:
              print(f"::error::broken: {b}")
          print(f"{len(bad)} broken link(s)")
          sys.exit(1 if bad else 0)
          PY
